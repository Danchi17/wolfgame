<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多能力一夜人狼</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:,">
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <!-- より安定したPeerJSのバージョンを使用 -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="app"></div>
    <!-- スクリプトの読み込み順序を修正 -->
<script src="js/game/gameUtils.js"></script>
<script src="js/game/gameState.js"></script>
<script src="js/game/roleLogic.js"></script>
<script src="js/game/gamePhases.js"></script>
<script src="js/game/gameSetup.js"></script>
<script src="js/actions/actionResults.js"></script>
<script src="js/actions/playerActions.js"></script>
<script src="js/actions/specialActions.js"></script>
<script src="js/actions/voteActions.js"></script>
<script src="js/network.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
    
    <!-- エラーハンドリング -->
    <script>
        window.addEventListener('error', (event) => {
            console.error('グローバルエラー:', event.error);
            // クリティカルなエラーのみユーザーに通知
            if (event.error && event.error.message && 
                (event.error.message.includes('is not a function') || 
                 event.error.message.includes('is not defined'))) {
                alert('エラーが発生しました。ページをリロードしてください。');
            }
        });
    </script>
</body>
</html>
